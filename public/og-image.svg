<?xml version="1.0" encoding="UTF-8"?>
<!-- Design source for public/og-image.jpg (1200x630 JPEG q90, rendered via scripts/render-og-image.mjs).
     Social crawlers (WhatsApp, Facebook, X) do not render SVG og:images — keep the JPG in sync. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <g transform="translate(600 172)">
    <rect x="-104" y="-104" width="208" height="208" rx="44" fill="#ffffff" fill-opacity="0.12"/>
    <text x="0" y="34" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="164" font-weight="700" fill="#ffffff">₹</text>
  </g>
  <text x="600" y="418" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="700" fill="#ffffff">BalCheck<tspan fill="#93c5fd">.in</tspan></text>
  <text x="600" y="492" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="500" fill="#dbeafe">बैंक बैलेंस चेक नंबर — 79 बैंकों के लिए</text>
  <text x="600" y="556" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="400" fill="#bfdbfe">missed call + customer care numbers, एक जगह</text>
</svg>
