name = "balcheck"
main = "./src/worker.ts"
compatibility_date = "2026-01-30"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true
# Missing paths (typos, stale links) return the custom 404 page with a 404 status.
not_found_handling = "404-page"

[observability]
enabled = true
